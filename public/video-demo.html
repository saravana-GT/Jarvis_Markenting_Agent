<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Platform - Official Explainer Video (MP4 / MKV)</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080a0f;
      --panel-bg: rgba(15, 20, 30, 0.85);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-glow: rgba(0, 242, 254, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
    }

    .container {
      max-width: 1100px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .video-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(16px);
      padding: 12px;
    }

    video {
      width: 100%;
      height: 560px;
      border-radius: 14px;
      background: #000;
      outline: none;
    }

    .download-row {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .btn-download {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #040810;
      font-weight: 800;
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px var(--accent-glow);
      transition: all 0.25s ease;
    }

    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px var(--accent-glow);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎬 JARVIS Platform - Official Explainer Video</h1>
    <p>Rendered in 1080p Full HD • Pure English Voiceover & Subtitles</p>
  </div>

  <div class="video-card">
    <video controls autoplay poster="images/hd_jarvis_dashboard_1788585706847.jpg">
      <source src="jarvis_explainer_video.mp4" type="video/mp4">
      <source src="jarvis_explainer_video.mkv" type="video/x-matroska">
      Your browser does not support the video tag.
    </video>
  </div>

  <div class="download-row">
    <a href="jarvis_explainer_video.mp4" download class="btn-download">⬇ Download MP4 Video (4.15 MB)</a>
    <a href="jarvis_explainer_video.mkv" download class="btn-download" style="background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--border-color);">⬇ Download MKV Video (4.12 MB)</a>
  </div>
</div>

</body>
</html>
