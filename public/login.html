<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis login</title>
    <style>
      :root {
        --bg: #070a13;
        --panel: rgba(255, 255, 255, 0.05);
        --text: #f8fafc;
        --accent: #38bdf8;
        --border: rgba(255, 255, 255, 0.18);
        --glow: rgba(56, 189, 248, 0.15);
      }
      * { box-sizing: border-box; }
      body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        background: var(--bg); 
        color: var(--text); 
        margin: 0; 
        display: grid; 
        place-items: center; 
        min-height: 100vh;
        overflow: hidden;
      }
      #canvas3d {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
        background: radial-gradient(circle at center, #0c1424 0%, #050811 100%);
      }
      .card { 
        background: var(--panel); 
        padding: 32px 24px; 
        border-radius: 16px; 
        width: min(92vw, 380px); 
        border: 1px solid var(--border); 
        box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.15), 0 8px 32px 0 rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        color: var(--text);
        transition: all 0.3s ease;
      }
      .card:hover {
        border-color: rgba(255, 255, 255, 0.3);
        box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.25), 0 8px 32px 0 rgba(0, 0, 0, 0.4), 0 0 12px var(--glow);
      }
      h2 {
        margin-top: 0;
        margin-bottom: 24px;
        font-size: 1.5rem;
        text-align: center;
        color: var(--text);
        text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
      }
      input { 
        width: 100%; 
        padding: 12px; 
        margin-bottom: 16px; 
        border-radius: 8px; 
        border: 1px solid rgba(255, 255, 255, 0.1); 
        background: rgba(11, 18, 32, 0.5); 
        color: var(--text); 
        outline: none;
        transition: all 0.2s ease;
      }
      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
        background: rgba(11, 18, 32, 0.75);
      }
      button { 
        width: 100%; 
        padding: 12px; 
        border: 0; 
        border-radius: 8px; 
        background: var(--accent); 
        color: #082f49;
        font-weight: 700; 
        cursor: pointer; 
        box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
        transition: all 0.2s ease;
      }
      button:hover {
        background: #7dd3fc;
        box-shadow: 0 0 16px rgba(56, 189, 248, 0.45);
      }
      #message {
        color: #ef4444;
        text-align: center;
        margin-top: 12px;
        margin-bottom: 0;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas3d"></canvas>
    <div class="card">
      <h2>Agency owner sign-in</h2>
      <form id="loginForm">
        <input name="username" placeholder="Username" required />
        <input name="password" type="password" placeholder="Password" required />
        <button type="submit">Sign in</button>
      </form>
      <p id="message"></p>
    </div>
    
    <script>
      (function() {
        const canvas = document.getElementById('canvas3d');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        });

        const numParticles = 800;
        const particles = [];

        for (let i = 0; i < numParticles; i++) {
          const phi = Math.acos(-1 + (2 * i) / numParticles);
          const theta = Math.sqrt(numParticles * Math.PI) * phi;
          const r = 200;
          particles.push({
            x: r * Math.cos(theta) * Math.sin(phi),
            y: r * Math.sin(theta) * Math.sin(phi),
            z: r * Math.cos(phi),
            color: i % 2 === 0 ? '#38bdf8' : '#818cf8',
            size: 2.2
          });
        }

        let angleX = 0;
        let angleY = 0;
        let mouseX = 0;
        let mouseY = 0;

        window.addEventListener('mousemove', (e) => {
          mouseX = (e.clientX - width / 2) / (width / 2);
          mouseY = (e.clientY - height / 2) / (height / 2);
        });

        const perspective = 500;

        function animate() {
          requestAnimationFrame(animate);
          ctx.clearRect(0, 0, width, height);
          
          angleY += 0.0015;
          angleX += 0.0005;
          
          const targetRotY = angleY + mouseX * 0.35;
          const targetRotX = angleX + mouseY * 0.35;
          
          const cosY = Math.cos(targetRotY);
          const sinY = Math.sin(targetRotY);
          const cosX = Math.cos(targetRotX);
          const sinX = Math.sin(targetRotX);
          
          const projected = [];
          
          for (let p of particles) {
            let x1 = p.x * cosY - p.z * sinY;
            let z1 = p.z * cosY + p.x * sinY;
            
            let y2 = p.y * cosX - z1 * sinX;
            let z2 = z1 * cosX + p.y * sinX;
            
            const scale = perspective / (perspective + z2 + 300);
            const screenX = width / 2 + x1 * scale * 1.2;
            const screenY = height / 2 + y2 * scale * 1.2;
            
            projected.push({
              x: screenX,
              y: screenY,
              z: z2,
              color: p.color,
              size: p.size * scale
            });
          }
          
          projected.sort((a, b) => b.z - a.z);
          
          for (let p of projected) {
            if (p.x >= 0 && p.x < width && p.y >= 0 && p.y < height) {
              const alpha = Math.max(0.22, Math.min(0.92, (perspective - p.z) / (perspective * 1.4)));
              
              // Outer glow
              ctx.beginPath();
              ctx.fillStyle = p.color;
              ctx.globalAlpha = alpha * 0.35;
              ctx.arc(p.x, p.y, p.size * 2.3, 0, Math.PI * 2);
              ctx.fill();

              // Inner core
              ctx.beginPath();
              ctx.fillStyle = p.color;
              ctx.globalAlpha = alpha;
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }

        animate();
      })();
    </script>
    <script>
      document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = Object.fromEntries(new FormData(event.target).entries());
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (response.ok) {
          window.location.href = '/';
        } else {
          document.getElementById('message').textContent = result.error || 'Login failed';
        }
      });
    </script>
  </body>
</html>
