<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis login</title>
    <style>
      body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; display: grid; place-items: center; min-height: 100vh; }
      .card { background: #111827; padding: 24px; border-radius: 16px; width: min(92vw, 360px); border: 1px solid #1f2937; }
      input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #334155; background: #0b1220; color: #f8fafc; }
      button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #38bdf8; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Agency owner sign-in</h2>
      <form id="loginForm">
        <input name="username" placeholder="Username" required />
        <input name="password" type="password" placeholder="Password" required />
        <button type="submit">Sign in</button>
      </form>
      <p id="message"></p>
    </div>
    <script>
      document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = Object.fromEntries(new FormData(event.target).entries());
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (response.ok) {
          window.location.href = '/';
        } else {
          document.getElementById('message').textContent = result.error || 'Login failed';
        }
      });
    </script>
  </body>
</html>
